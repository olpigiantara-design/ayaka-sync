<div id="loginScreen" class="fixed inset-0 z-[100] bg-[#DBEAFE] flex items-center justify-center p-4 hidden">
    <div class="bg-white brutal-border shadow-neo-lg rounded-3xl w-full max-w-sm p-6 space-y-5 modal-enter">
        <div class="text-center space-y-2">
            <div class="w-16 h-16 bg-neo-accentBlue brutal-border rounded-2xl flex items-center justify-center text-white font-black text-2xl shadow-neo-sm mx-auto">
                AS
            </div>
            <h2 class="text-2xl font-black text-neo-border">Login Portal</h2>
            <p class="text-xs font-semibold text-gray-500">Silakan masuk untuk mengakses Ayaka Sync</p>
        </div>

        <div class="space-y-3">
            <div>
                <label class="block text-xs font-black text-neo-border uppercase mb-1">Username</label>
                <input type="text" id="loginUsername" placeholder="Masukkan Username..." class="w-full p-3 bg-neo-bg brutal-border rounded-xl text-sm font-bold text-neo-border focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-xs font-black text-neo-border uppercase mb-1">Password</label>
                <input type="password" id="loginPassword" placeholder="Masukkan Password..." class="w-full p-3 bg-neo-bg brutal-border rounded-xl text-sm font-bold text-neo-border focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <button onclick="handleLogin()" class="w-full py-3.5 bg-neo-accentBlue hover:bg-blue-700 text-white font-black text-sm rounded-xl brutal-border shadow-neo neo-btn flex items-center justify-center gap-2">
            <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
        </button>

        <p class="text-center text-[10px] font-bold text-gray-500">
            Belum punya akun? <br> <span class="text-blue-600">Login otomatis mendaftarkan akun baru (Demo)</span>
        </p>
    </div>
</div>
