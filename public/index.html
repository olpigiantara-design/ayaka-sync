<!-- === LOGIN SCREEN (tambahkan toggle register) === -->
<div id="loginScreen">
  <div class="login-box">
    <h2 id="loginTitle">LOGIN AKUN</h2>
    <p id="loginSubtitle">Masuk untuk mengakses generator Alight Motion Premium.</p>
    <div class="field">
      <label class="label">Alamat Email</label>
      <input type="email" id="loginEmail" placeholder="user@gmail.com">
    </div>
    <div class="field">
      <label class="label">Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn blue" id="btnAuthSubmit">🔑 Masuk Sekarang</button>
    <div style="text-align:center; margin-top:15px; font-size:11px; opacity:0.6; font-weight:600;">
      <span id="loginSwitchText">Belum punya akun? </span>
      <a href="#" id="btnAuthSwitch" style="color:var(--blue); text-decoration:underline;">Daftar sekarang</a>
    </div>
  </div>
</div>
